name: update-date
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write today's date into README
        run: |
          TODAY=$(date -u '+%B %-d, %Y')
          sed -i -E "s/now \([A-Za-z]+ [0-9]{1,2}, [0-9]{4} UTC\)/now ($TODAY UTC)/" README.md
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "The date is already current."; exit 0; fi
          git commit -q -am "Update date"
          for attempt in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
